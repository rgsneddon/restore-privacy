# mineperc.restoreprivacy.online — static BeamHash III landing (1466/3334).
# /api and /health go to mineperc_server.js. Do not let :8011 own GET /.
server {
    listen 80;
    listen [::]:80;
    server_name mineperc.restoreprivacy.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mineperc.restoreprivacy.online;
    ssl_certificate /etc/letsencrypt/live/evolve.restoreprivacy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolve.restoreprivacy.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mineperc.restoreprivacy.online;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8011/health;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8011/api/;
    }
    # Homepage + confirmations come from mineperc_server.js so a
    # /var/www version-only copy cannot drop the Live miners table.
    location = / {
        proxy_pass http://127.0.0.1:8011/;
    }
    location = /index.html {
        proxy_pass http://127.0.0.1:8011/index.html;
    }
    location = /confirmations {
        proxy_pass http://127.0.0.1:8011/confirmations;
    }
    location = /confirmations.html {
        proxy_pass http://127.0.0.1:8011/confirmations.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
