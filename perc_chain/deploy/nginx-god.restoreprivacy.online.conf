# god.restoreprivacy.online — GOD · rpAI page on Helsinki.
# HTTPS → loopback god_port.py :8013. :1474 is $GNFP stratum (gnfp pool :8014).
# TLS uses the existing god.restoreprivacy.online Let's Encrypt cert.

server {
    listen 80;
    listen [::]:80;
    server_name god.restoreprivacy.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name god.restoreprivacy.online;
    ssl_certificate /etc/letsencrypt/live/god.restoreprivacy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/god.restoreprivacy.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8013/;
    }
}

# Helsinki bind note: 135.181.152.10 hosts this vhost.
# Public $GNFP stratum is :1474 (backend 127.0.0.1:8014).
