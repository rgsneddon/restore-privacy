# admin.shear.digital — same GOD Join how-to as god.restoreprivacy.online.
# HTTPS → loopback god_port.py :8013. Dedicated-de only. Not the kyrusfables
# admin panel (8088). A record already points here.

server {
    listen 80;
    listen [::]:80;
    server_name admin.shear.digital;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.shear.digital;
    ssl_certificate /etc/letsencrypt/live/admin.shear.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.shear.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8013/;
    }
}
