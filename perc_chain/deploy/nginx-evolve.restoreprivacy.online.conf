# evolve.restoreprivacy.online — Perccent / Evolve explorer on Helsinki.
# Backend is perc_chain on loopback :9478.
# TLS uses the existing evolve.restoreprivacy.online Let's Encrypt cert.

server {
    listen 80;
    listen [::]:80;
    server_name evolve.restoreprivacy.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evolve.restoreprivacy.online;
    ssl_certificate /etc/letsencrypt/live/evolve.restoreprivacy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolve.restoreprivacy.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:9478/;
    }
}
