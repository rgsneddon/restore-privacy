# evolve.restoreprivacy.online — Evolve Chronoflux APP landing on Helsinki.
# Static homepage is the app (info + installers). perc_chain APIs, /perc
# rendezvous, and the Perccent explorer stay on loopback :9478.
# Do not proxy GET / to the GNFP pool (:8014) or to perc_chain index.html.

server {
    listen 80;
    listen [::]:80;
    server_name evolve.restoreprivacy.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evolve.restoreprivacy.online;
    ssl_certificate /etc/letsencrypt/live/evolve.restoreprivacy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolve.restoreprivacy.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/evolve.restoreprivacy.online;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:9478/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:9478/api/;
    }

    location /perc/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:9478/perc/;
    }

    location = /explorer {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:9478/explorer;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:9478/public/;
        proxy_set_header Host $host;
    }

    location = /app {
        return 302 /app/;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app/index.html {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
