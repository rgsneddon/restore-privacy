name: restore_privacy_client
description: "Restore Privacy Suite — residual VPN, Perccent wallet (%), and Evolve."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Restore Privacy Suite v 1.0.0 monopin.
version: 1.0.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  provider: ^6.1.2
  # Embed live Perccent block explorer in the Suite % wallet tab.
  webview_flutter: ^4.10.0

  # Perccent wallet (%) and Evolve Chronoflux (EVOLVE) — path deps, one source.
  perccent_wallet:
    path: ../../git
  evolve:
    path: ../../evolve

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # Match wallet/evolve Windows secure-storage stub (no ATL/MFC required).
  flutter_secure_storage_windows:
    path: ../../git/stubs/flutter_secure_storage_windows
  # path_provider_android JNI pin (wallet cold-start).
  path_provider_android: 2.2.19

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo-256.png
    - assets/brand/logo-512.png
    - assets/brand/app_icon.png
    - assets/config/perc_network.json
    # Host-mirrored assets so bare rootBundle paths in path packages resolve.
    - assets/data/outcome_registry.json
    - assets/banner/evolve.jpg
    - assets/flags/gb.png
    - assets/flags/us.png
    - assets/flags/eu.png
    - assets/branding/my_perc_logo.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
