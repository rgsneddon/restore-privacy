<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restore Privacy Suite</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <header class="brand">
        <img src="icons/icon-48.png" width="40" height="40" alt="" />
        <div>
          <h1 id="title">RESTORE PRIVACY SUITE</h1>
          <p class="catalog" id="catalog">Rx browser · companion to Suite 1.0.6</p>
        </div>
      </header>

      <p class="status-line">
        Status:
        <strong id="status-text">…</strong>
      </p>

      <div class="keygen-gate" id="keygen-gate" data-keygen-gate="1">
        <label class="keygen-label" for="keygen-input"
          >KEYGEN (one-time unlock for this app)</label
        >
        <input
          type="text"
          id="keygen-input"
          class="keygen-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="RPT-KEY-…"
        />
        <button type="button" id="btn-unlock" class="btn btn-unlock">
          Unlock with KEYGEN
        </button>
      </div>

      <div class="actions">
        <button type="button" id="btn-connect" class="btn btn-connect">
          Connect
        </button>
        <button type="button" id="btn-disconnect" class="btn btn-disconnect">
          Disconnect
        </button>
      </div>

      <p class="error" id="error-text" hidden></p>

      <p class="disclaimer" id="disclaimer"></p>

      <p class="footer">
        Native residual clients (Windows · Android · macOS · iOS · Linux):
        <a href="https://restoreprivacy.online/" target="_blank" rel="noopener"
          >restoreprivacy.online</a
        >
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
