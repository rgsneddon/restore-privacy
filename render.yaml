# Render Blueprint — Restore Privacy public VPN APP Shop + private /admin
# Public: title + paid downloads. Private /admin: operator login, payment
# processor settings (Stripe/BMC readiness), paid-download grant admin.
# Set secrets in the Render dashboard — never commit real keys/passwords.
services:
  - type: web
    name: restore-privacy-status
    runtime: python
    plan: free
    rootDir: status_page
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RPT_STATUS_UPSTREAM
        value: http://82.221.101.241:8080/api/status
      - key: RPT_STATUS_TIMEOUT
        value: "4"
      # Public site origin (Checkout success/cancel + webhook display on /admin).
      # Already set here — leave blank in /admin processor form (do not clear this).
      - key: RPT_PUBLIC_BASE_URL
        value: https://restoreprivacy.online
      # Live catalog Pay buttons (not temporary Coming soon)
      - key: RPT_CATALOG_BUY_LIVE
        value: "1"
      # Operator-only /admin (required to enable private payment admin page)
      - key: RPT_ADMIN_USER
        value: admin
      - key: RPT_ADMIN_PASSWORD
        sync: false
      - key: RPT_ADMIN_SESSION_SECRET
        sync: false
      # Stripe paid downloads (£2.45) — paste secrets in Render dashboard (sync: false).
      # Never commit real sk_… / whsec_… values.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional one-time price_… ; leave unset for unit_amount=245 (£2.45) Checkout
      - key: STRIPE_CHECKOUT_PRICE_ID
        sync: false
      # Private-repo installer proxy (optional fallback; prefer Iceland VPS store)
      - key: RPT_GITHUB_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Iceland VPS paid installer store (status host fetches with token after pay)
      - key: RPT_VPS_ASSET_BASE
        value: http://82.221.101.241:8081/paid-assets
      - key: RPT_ASSET_FETCH_TOKEN
        sync: false
