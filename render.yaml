# Render Blueprint — Restore Privacy public VPN APP Shop + private /admin
# Public: title + paid downloads. Private /admin: operator login, payment
# processor settings (Stripe/BMC readiness), paid-download grant admin.
# Set secrets in the Render dashboard — never commit real keys/passwords.
#
# Durable admin licence + paid-download grants:
#   Free web instances cannot attach a persistent disk. Starter (or higher)
#   + disk below keep paid_downloads.sqlite3 across deploys/restarts.
#   RPT_PAYMENT_DATA_DIR must point under the disk mountPath.
services:
  - type: web
    name: restore-privacy-status
    runtime: python
    # Paid instance required for persistent disk (free plan is ephemeral only).
    plan: starter
    rootDir: status_page
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    # Survives host redeploy/restart — licence DB + grant history for /admin
    disk:
      name: rpt-payment-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Licence + paid download grants SQLite (admin history). Must live on disk.
      - key: RPT_PAYMENT_DATA_DIR
        value: /var/data/rpt-payment
      - key: RPT_STATUS_UPSTREAM
        value: http://82.221.101.241:8080/api/status
      - key: RPT_STATUS_TIMEOUT
        value: "4"
      # Public site origin (Checkout success/cancel + webhook display on /admin).
      # Already set here — leave blank in /admin processor form (do not clear this).
      - key: RPT_PUBLIC_BASE_URL
        value: https://restoreprivacy.online
      # Live catalog Pay buttons (not temporary Coming soon)
      - key: RPT_CATALOG_BUY_LIVE
        value: "1"
      # Operator-only /admin (required to enable private payment admin page)
      - key: RPT_ADMIN_USER
        value: admin
      - key: RPT_ADMIN_PASSWORD
        sync: false
      - key: RPT_ADMIN_SESSION_SECRET
        sync: false
      # Stripe KEYGEN (£3.00/mo or £30.00/yr; trial_period_days=0) — secrets in Dashboard.
      # Never commit real sk_… / whsec_… values. Residual free trial is in-app only (72h).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional one-time price_… ; catalog default is subscription Checkout (no Stripe trial)
      - key: STRIPE_CHECKOUT_PRICE_ID
        sync: false
      # Customer fulfilment email after KEYGEN pay (keygen + PPI + download link).
      # Secrets stay in Dashboard (sync: false). Non-secret defaults are safe to ship.
      - key: RPT_FULFILMENT_SMTP_HOST
        sync: false
      - key: RPT_FULFILMENT_SMTP_PORT
        value: "587"
      - key: RPT_FULFILMENT_SMTP_USER
        sync: false
      - key: RPT_FULFILMENT_SMTP_PASSWORD
        sync: false
      - key: RPT_FULFILMENT_FROM_EMAIL
        value: noreply@restoreprivacy.online
      - key: RPT_FULFILMENT_SMTP_TLS
        value: "1"
      # Private-repo installer proxy (optional fallback; prefer Iceland VPS store)
      - key: RPT_GITHUB_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Iceland VPS paid installer store (status host fetches with token after pay)
      - key: RPT_VPS_ASSET_BASE
        value: http://82.221.101.241:8081/paid-assets
      # Optional: admin "Push Suite packages to Helsinki" live SSH upload.
      # Without these, live upload fails closed (use Dry-run or push from a laptop with keys).
      # Prefer RPT_SSH_PRIVATE_KEY (PEM secret) or mount a key under /var/data/rpt-ssh/.
      - key: RPT_SSH_KEY
        sync: false
      - key: RPT_SSH_PRIVATE_KEY
        sync: false
      - key: RPT_SSH_KEY_DIR
        sync: false
      - key: RPT_SSH_HOST
        value: "135.181.152.10"
      - key: RPT_SSH_USER
        value: root
      - key: RPT_ASSET_FETCH_TOKEN
        sync: false
      # Admin fleet usage panel: private capacity probes (same token as residual nodes).
      # Paste token from operator machine ~/.restore_privacy/capacity_token.txt — never commit.
      - key: RPT_CAPACITY_TOKEN
        sync: false
      # Product bandwidth allowances (bits/s) for used-vs-cap rows (not secret).
      - key: RPT_BANDWIDTH_CAP_BPS_MAP
        value: '{"82.221.101.241":100000000,"185.146.232.107":100000000,"167.233.224.5":200000000,"IS":100000000,"RO":100000000,"DE":200000000}'
      - key: RPT_CAPACITY_PROBE_TIMEOUT
        value: "2.5"
