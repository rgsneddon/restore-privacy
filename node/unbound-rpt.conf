# Restore Privacy — tunnel-only recursive DNS (Unbound)
# Installed by node/install_dns.sh to /etc/unbound/unbound.conf.d/rpt-tunnel.conf
# (or similar). Listen ONLY on the RPT tunnel gateway — not 0.0.0.0 public.
#
# Clients send DNS to 10.88.0.1 when full tunnel is up (client.full_tunnel defaults).
# Upstream: DNS-over-TLS (DoT) to privacy-focused resolvers — encrypted recursive
# path from the node (VPS provider still sees DoT endpoints; not client-side
# public DNS fallbacks).

server:
    # Privacy-oriented defaults
    verbosity: 0
    use-syslog: yes
    do-daemonize: no
    username: "unbound"
    directory: "/etc/unbound"
    # Prefer not to log query names (reduce retention surface)
    log-queries: no
    log-replies: no
    log-servfail: no
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    # TLS for DoT upstream
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    # Do not recurse for the open internet on public ifaces
    interface: 10.88.0.1
    port: 53
    # Only tunnel client pool may query
    access-control: 127.0.0.0/8 allow
    access-control: 10.88.0.0/24 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

# Privacy-focused DoT upstream (Quad9 + dns.sb). Not open public recursion on WAN.
# Clients still use only 10.88.0.1 — no Cloudflare/Google on the client residual path.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Quad9 (malware blocking, no client IP logging claim — operator still trusts them)
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    # dns.sb (privacy-oriented)
    forward-addr: 185.222.222.222@853#dot.sb
    forward-addr: 45.11.45.11@853#dot.sb
