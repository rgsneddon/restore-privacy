# Restore Privacy — tunnel-only recursive DNS (Unbound)
# Installed by node/install_dns.sh to /etc/unbound/unbound.conf.d/rpt-tunnel.conf
# (or similar). Listen ONLY on the RPT tunnel gateway — not 0.0.0.0 public.
#
# Clients send DNS to 10.88.0.1 when full tunnel is up (client.full_tunnel defaults).
#
# IMPORTANT (ops, 2026-08): Ubuntu unbound 1.13 on product residual hosts refused
# CLIENT queries sourced from 10.88.0.0/24 when ACL was written as
#   access-control: 10.88.0.0/24 allow
#   access-control: 0.0.0.0/0 refuse
# while the same process accepted 127.0.0.1. That made residual Connect look
# "Connected" (dual /1 + dataplane) with zero working DNS — user-visible
# blackhole. Mitigation: bind *only* interface 10.88.0.1 and allow queries on
# that socket. The public WAN cannot reach 10.88.0.1:53 without already being
# on the tunnel, so allow-all on this bind is not an open resolver.

server:
    verbosity: 0
    use-syslog: yes
    do-daemonize: no
    username: "unbound"
    directory: "/etc/unbound"
    log-queries: no
    log-replies: no
    log-servfail: no
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    # Iterator only — avoid client-subnet module surprises on tunnel clients
    module-config: "validator iterator"
    # Listen ONLY on tunnel gateway (not 0.0.0.0 public)
    interface: 10.88.0.1
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # Safe while interface is tunnel-only (see header). Explicit 10.88/24 allow
    # alone was refused on Ubuntu 1.13 residual hosts — do not reintroduce that
    # refuse pattern without verifying dig @10.88.0.1 -b 10.88.0.50.
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 refuse

# Plain recursive forward (reliable on residual VPS). Prefer availability of
# tunnel DNS over DoT complexity; operator may switch to forward-tls-upstream
# after verifying tunnel-client dig succeeds.
forward-zone:
    name: "."
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
